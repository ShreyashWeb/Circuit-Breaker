spring.application.name=inventory-service
server.port=${PORT:8082}

# Database Configuration (defaults to H2 in-memory, override with DB_URL for MySQL)
spring.datasource.url=${DB_URL:jdbc:h2:mem:inventorydb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

eureka.client.service-url.defaultZone=${EUREKA_URL:${EUREKA_SERVER_URL:http://localhost:8761}/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Actuator & Health Check Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.defaults.enabled=true

# Distributed Tracing Configuration (Micrometer + Zipkin)
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
