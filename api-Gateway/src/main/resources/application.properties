spring.application.name=api-Gateway
server.port=${PORT:8080}

# Eureka Server Configuration (local by default, override with EUREKA_SERVER_URL env var)
eureka.client.service-url.defaultZone=${EUREKA_URL:${EUREKA_SERVER_URL:http://localhost:8761}/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ==========================================
# Gateway Routes
# ==========================================

# Route 0: Inventory Service (Protected with Circuit Breaker)
spring.cloud.gateway.server.webflux.routes[0].id=inventory-service
spring.cloud.gateway.server.webflux.routes[0].uri=${INVENTORY_SERVICE_URL:lb://INVENTORY-SERVICE}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/inventory/**
spring.cloud.gateway.server.webflux.routes[0].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.name=inventoryCB
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.fallbackUri=forward:/fallback/inventory

# Route 1: Recommendation Service (Protected with Circuit Breaker)
spring.cloud.gateway.server.webflux.routes[1].id=recommendation-service
spring.cloud.gateway.server.webflux.routes[1].uri=${RECOMMENDATION_SERVICE_URL:lb://RECOMMENDATION-SERVICE}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/recommendations/**,/recommendations/**
spring.cloud.gateway.server.webflux.routes[1].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.name=recommendationCB
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.fallbackUri=forward:/fallback/recommendations

# Route 2: Product Service (Protected with Circuit Breaker)
spring.cloud.gateway.server.webflux.routes[2].id=product-service
spring.cloud.gateway.server.webflux.routes[2].uri=${PRODUCT_SERVICE_URL:lb://PRODUCT-SERVICE}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/products/**
spring.cloud.gateway.server.webflux.routes[2].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[2].filters[0].args.name=productCB
spring.cloud.gateway.server.webflux.routes[2].filters[0].args.fallbackUri=forward:/fallback/products

# ==========================================
# Resilience4j Circuit Breaker & Time Limiter Configuration
# ==========================================
resilience4j.circuitbreaker.configs.default.sliding-window-size=6
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=4
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.circuitbreaker.instances.recommendationCB.base-config=default
resilience4j.circuitbreaker.instances.productCB.base-config=default
resilience4j.circuitbreaker.instances.inventoryCB.base-config=default

resilience4j.timelimiter.configs.default.timeout-duration=2s
resilience4j.timelimiter.instances.recommendationCB.base-config=default
resilience4j.timelimiter.instances.productCB.base-config=default
resilience4j.timelimiter.instances.inventoryCB.base-config=default

# ==========================================
# Resilience4j Bulkhead & Rate Limiter Configuration (Week 3 Requirements)
# ==========================================
resilience4j.bulkhead.configs.default.max-concurrent-calls=25
resilience4j.bulkhead.configs.default.max-wait-duration=100ms
resilience4j.bulkhead.instances.recommendationCB.base-config=default
resilience4j.bulkhead.instances.productCB.base-config=default
resilience4j.bulkhead.instances.inventoryCB.base-config=default

resilience4j.ratelimiter.configs.default.limit-for-period=100
resilience4j.ratelimiter.configs.default.limit-refresh-period=1s
resilience4j.ratelimiter.configs.default.timeout-duration=0s
resilience4j.ratelimiter.instances.recommendationCB.base-config=default
resilience4j.ratelimiter.instances.productCB.base-config=default
resilience4j.ratelimiter.instances.inventoryCB.base-config=default

# ==========================================
# Distributed Tracing Configuration (Micrometer + Zipkin - Week 4 Requirements)
# ==========================================
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

# ==========================================
# Global CORS Configuration (for React UI Dashboard)
# ==========================================
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origin-patterns=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true

# ==========================================
# Actuator & Health Endpoints
# ==========================================
management.endpoints.web.exposure.include=health,info,gateway,circuitbreakers,circuitbreakerevents,ratelimiters,bulkheads
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
management.health.ratelimiters.enabled=true
management.endpoints.web.cors.allowed-origin-patterns=*
management.endpoints.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
management.endpoints.web.cors.allowed-headers=*
management.endpoints.web.cors.allow-credentials=true