spring.application.name=recommendation-service

server.port=${PORT:8083}

# Eureka Client Configuration (local by default, override with EUREKA_SERVER_URL env var)
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Distributed Tracing Configuration (Micrometer + Zipkin)
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

# Database Configuration (defaults to H2 in-memory, override with DB_URL for MySQL)
spring.datasource.url=${DB_URL:jdbc:h2:mem:recommendationdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true